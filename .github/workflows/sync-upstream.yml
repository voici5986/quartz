name: Sync Upstream Quartz v4

on:
  # 每天UTC时间00:00自动运行（北京时间08:00）
  schedule:
    - cron: '0 0 * * *'
  
  # 也可以手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout v4 branch
      uses: actions/checkout@v4
      with:
        ref: v4
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream remote and fetch
      run: |
        git remote add upstream https://github.com/jackyzha0/quartz.git || true
        git fetch upstream

    - name: Check available branches
      run: |
        echo "=== 本地分支 ==="
        git branch -a
        echo "=== 上游分支 ==="
        git ls-remote --heads upstream

    - name: Check if upstream v4 exists
      run: |
        if ! git ls-remote --exit-code --heads upstream v4; then
          echo "Error: upstream/v4 branch does not exist"
          echo "Let's check what branches are available:"
          git ls-remote --heads upstream
          
          # 检查是否有其他可能的分支
          if git ls-remote --exit-code --heads upstream main; then
            echo "Found upstream/main branch instead"
          elif git ls-remote --exit-code --heads upstream master; then
            echo "Found upstream/master branch instead"
          fi
          
          exit 1
        fi
        echo "upstream/v4 branch found successfully"

    - name: Ensure on v4 branch
      run: |
        git checkout v4
        echo "Current branch: $(git branch --show-current)"

    - name: Check for changes
      id: check_changes
      run: |
        LOCAL=$(git rev-parse HEAD)
        REMOTE=$(git rev-parse upstream/v4)
        
        echo "Local v4 commit: $LOCAL"
        echo "Upstream v4 commit: $REMOTE"
        
        if [ "$LOCAL" != "$REMOTE" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "✅ 发现上游 Quartz v4 分支有新的更新"
          
          # 显示将要同步的提交
          echo "=== 新提交预览 ==="
          git log --oneline $LOCAL..$REMOTE || echo "无法显示提交差异"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "ℹ️  上游 Quartz v4 分支没有新的更新"
        fi

    - name: Merge upstream changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        echo "🔄 开始合并 upstream/v4 到本地 v4 分支"
        git merge upstream/v4 --no-edit --allow-unrelated-histories
        echo "✅ 合并完成"
        
    - name: Push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        echo "📤 推送更新到 origin/v4"
        git push origin v4
        echo "✅ 推送完成"
        
    - name: Create Pull Request on conflict
      if: failure() && steps.check_changes.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: sync-upstream-quartz-v4-${{ github.run_number }}
        base: v4
        title: "🔄 同步 Quartz v4 分支上游更新（有冲突）"
        body: |
          ## 📋 同步信息
          
          这是一个自动生成的PR，用于同步 Quartz v4 分支的上游更新。
          
          ⚠️ **由于存在冲突，无法自动合并，请手动解决冲突后合并此PR。**
          
          - 上游仓库: https://github.com/jackyzha0/quartz
          - 同步分支: v4 ← upstream/v4
          
          ## 📝 更新内容
          请查看commits了解具体更新内容。
          
          ## ⚠️ 注意事项
          - 这是 Quartz v4 静态站点生成器的更新
          - 请检查 `quartz.config.ts` 配置文件是否有变更
          - 请检查 `quartz.layout.ts` 布局文件是否有变更  
          - 可能包含新的主题、插件或构建优化
          - 合并前建议先在本地测试构建: `npx quartz build`
          - 如有自定义样式，请检查CSS文件是否受影响
          
          ## 🔧 解决冲突步骤
          1. 在本地拉取这个分支
          2. 手动解决冲突
          3. 测试构建功能
          4. 合并PR
          
        labels: |
          sync
          automated
          quartz
          v4
          conflict
